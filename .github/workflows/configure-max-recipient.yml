name: Configure MAX recipient

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Upload API and add MAX recipient
        env:
          FTP_HOST: ${{ secrets.LEADS_FTP_HOST }}
          FTP_USER: ${{ secrets.LEADS_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.LEADS_FTP_PASSWORD }}
          NEW_MAX_CHAT_ID: '201893874'
        run: |
          python - <<'PY'
          import ftplib
          import io
          import os

          ftp = ftplib.FTP_TLS()
          ftp.connect(os.environ['FTP_HOST'], 21, timeout=30)
          ftp.login(os.environ['FTP_USER'], os.environ['FTP_PASSWORD'])
          ftp.prot_p()
          try:
              with open('api/lead.php', 'rb') as source:
                  ftp.storbinary('STOR /public_html/api/lead.php', source)

              recipients = set()
              for path in ['/private/max-chat-id.txt', '/private/max-chat-ids.txt']:
                  buffer = io.BytesIO()
                  try:
                      ftp.retrbinary('RETR ' + path, buffer.write)
                  except ftplib.error_perm as error:
                      if not str(error).startswith('550'):
                          raise
                      continue
                  recipients.update(buffer.getvalue().decode('utf-8').replace(',', ' ').split())

              recipients.add(os.environ['NEW_MAX_CHAT_ID'])
              content = ('\n'.join(sorted(recipients)) + '\n').encode('utf-8')
              ftp.storbinary('STOR /private/max-chat-ids.txt', io.BytesIO(content))
              print(f'Configured MAX recipients: {len(recipients)}')
          finally:
              ftp.quit()
          PY
